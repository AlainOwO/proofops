[project]
name = "proofops"
version = "0.1.0"
description = "Evidence-backed review of scoped ECS Fargate cost changes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "openai>=2.0,<3",
  "anthropic>=0.70,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5",
]

[project.scripts]
proofops = "proofops.cli:main"
proofops-worker = "proofops.workers.runner:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/proofops"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "hypothesis>=6.120,<7", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-jsonschema>=4.23", "types-requests>=2.32"]
docs = ["reportlab>=4.2,<5", "pymupdf>=1.25,<2", "pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires migrated real PostgreSQL", "policy: requires pinned Conftest", "load: measured workload experiment"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"scripts/**" = ["S603", "S607"]
"backend/proofops/policies/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["backend/proofops"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
