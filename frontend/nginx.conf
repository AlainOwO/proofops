server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location = /readyz { proxy_pass http://api:8000/readyz; proxy_set_header Host $host; }
    location = /healthz { proxy_pass http://api:8000/healthz; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
