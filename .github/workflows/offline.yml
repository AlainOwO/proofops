name: ProofOps offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: proofops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_MODE: "off"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --group dev --group docs
      - run: uv run python scripts/install_tools.py
      - run: uv run ruff check backend scripts tests evaluation demo
      - run: uv run ruff format --check backend scripts tests evaluation demo
      - run: uv run mypy backend/proofops
      - run: python scripts/configure_local.py
      - run: docker compose up -d --wait db
      - run: uv run python scripts/create_test_database.py
      - run: uv run pytest tests/unit tests/policy tests/integration --junitxml=artifacts/checks/backend.xml
      - run: uv run proofops evaluate --mode replay
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          {
            name: offline-results,
            path: "artifacts/checks\nartifacts/evaluation",
          }
      - run: docker compose down
        if: always()
  compose-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.12" }
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/containers/test_compose_migrations.py -q --junitxml=artifacts/checks/compose-migrations.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: compose-migration-results
          # Never upload generated environment files or private build contexts.
          path: |
            artifacts/checks/compose-migrations.xml
            artifacts/compose-migrations/*/result.json
            artifacts/compose-migrations/*/commands.log
  trusted-policy-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_MODE: "off"
      CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: incoming
          sparse-checkout: fixtures/replays
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.12" }
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --no-dev
        working-directory: trusted
      - run: uv run python scripts/ci_review.py --bundle ../incoming/fixtures/replays/unsafe-resize --source-revision "$CANDIDATE_REVISION"
        working-directory: trusted
      - run: cat artifacts/ci-review/summary.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: trusted
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: { name: trusted-review-bundle, path: trusted/artifacts/ci-review }
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_MODE: "off"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "22" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.12" }
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --no-dev
      - run: python scripts/configure_local.py
      - run: docker compose up -d --build --wait
      - run: uv run python scripts/prepare_browser_auth.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker compose exec -T api proofops reset-demo-data --yes
      - run: npm run screenshots:demo
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-results
          # Explicit paths exclude private credentials, environment files and cookie state.
          path: |
            artifacts/checks
            artifacts/screenshots
            artifacts/playwright
            artifacts/playwright-demo
            docs/screenshots
      - run: docker compose down
        if: always()
